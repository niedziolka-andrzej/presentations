<svg width="100%" viewBox="0 0 900 904" role="img" xmlns="http://www.w3.org/2000/svg" font-family='anthropic-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
<title>Thread contention for the GIL</title>
<desc>Four threads spawn from a main program, but the Global Interpreter Lock accepts only one holder at a time, so each thread's CPU-heavy work runs one after another instead of in parallel.</desc>
<style>
  .dgm-label { fill: #6E6D67; }
  .dgm-line  { stroke: #D9D7CC; }
  @media (prefers-color-scheme: dark) {
    .dgm-label { fill: #B7B5AA; }
    .dgm-line  { stroke: #55534C; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="90" y1="64" x2="90" y2="890" class="dgm-line" stroke-width="1.2"/><line x1="250" y1="64" x2="250" y2="890" class="dgm-line" stroke-width="1.2"/><line x1="390" y1="64" x2="390" y2="890" class="dgm-line" stroke-width="1.2"/><line x1="520" y1="64" x2="520" y2="890" class="dgm-line" stroke-width="1.2"/><line x1="650" y1="64" x2="650" y2="890" class="dgm-line" stroke-width="1.2"/><line x1="790" y1="64" x2="790" y2="890" class="dgm-line" stroke-width="1.2"/>
<line x1="90" y1="90" x2="250" y2="90" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170.0" y="84" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Spawn Thread 1</text><line x1="90" y1="116" x2="390" y2="116" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240.0" y="110" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Spawn Thread 2</text><line x1="90" y1="142" x2="520" y2="142" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="305.0" y="136" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Spawn Thread 3</text><line x1="90" y1="168" x2="650" y2="168" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="370.0" y="162" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Spawn Thread 4</text><g><rect x="210" y="204" width="620" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520.0" y="227.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806"></text></g><text x="520.0" y="224" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">All threads are created, but only one</text><text x="520.0" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">can hold the GIL at a time.</text><line x1="250" y1="278" x2="790" y2="278" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="520.0" y="272" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Request GIL</text><line x1="790" y1="304" x2="250" y2="304" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="520.0" y="298" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Lock acquired</text><path d="M 250,334 C 292,328 292,366 250,360" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="344.0" text-anchor="end" font-size="11.5" font-weight="400" class="dgm-label">Run CPU-heavy task</text><text x="240" y="359.0" text-anchor="end" font-size="11.5" font-weight="400" class="dgm-label">(factorial calc)</text><line x1="250" y1="384" x2="790" y2="384" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="520.0" y="378" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Release GIL</text><line x1="390" y1="418" x2="790" y2="418" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="590.0" y="412" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Request GIL</text><line x1="790" y1="444" x2="390" y2="444" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="590.0" y="438" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Lock acquired</text><path d="M 390,474 C 432,468 432,506 390,500" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="491.0" text-anchor="end" font-size="11.5" font-weight="400" class="dgm-label">Run CPU-heavy task</text><line x1="390" y1="524" x2="790" y2="524" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="590.0" y="518" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Release GIL</text><line x1="520" y1="558" x2="790" y2="558" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="655.0" y="552" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Request GIL</text><line x1="790" y1="584" x2="520" y2="584" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="655.0" y="578" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Lock acquired</text><path d="M 520,614 C 562,608 562,646 520,640" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="510" y="631.0" text-anchor="end" font-size="11.5" font-weight="400" class="dgm-label">Run CPU-heavy task</text><line x1="520" y1="664" x2="790" y2="664" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="655.0" y="658" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Release GIL</text><line x1="650" y1="698" x2="790" y2="698" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="720.0" y="692" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Request GIL</text><line x1="790" y1="724" x2="650" y2="724" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="720.0" y="718" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Lock acquired</text><path d="M 650,754 C 692,748 692,786 650,780" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><text x="640" y="771.0" text-anchor="end" font-size="11.5" font-weight="400" class="dgm-label">Run CPU-heavy task</text><line x1="650" y1="804" x2="790" y2="804" stroke="#898781" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="720.0" y="798" text-anchor="middle" font-size="11.5" font-weight="400" class="dgm-label">Release GIL</text><g><rect x="90" y="838" width="740" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="460.0" y="861.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806"></text></g><text x="460.0" y="858" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">All threads completed sequentially</text><text x="460.0" y="874" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">because of the GIL.</text>
<g><rect x="20.0" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="90.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">Main Program</text></g><g><rect x="202.0" y="20" width="96" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="250.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">Thread 1</text></g><g><rect x="342.0" y="20" width="96" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="390.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">Thread 2</text></g><g><rect x="472.0" y="20" width="96" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="520.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">Thread 3</text></g><g><rect x="602.0" y="20" width="96" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="650.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#444441">Thread 4</text></g><g><rect x="707.5" y="20" width="165" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="790.0" y="34.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Global Interpreter</text><text x="790.0" y="49.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Lock</text></g></svg>