<svg width="100%" viewBox="0 0 860 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family='anthropic-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
<title>Multiprocessing sidesteps the GIL</title>
<desc>A main program spawns four separate processes, each with its own Global Interpreter Lock, so their CPU-heavy tasks run truly in parallel across four cores instead of contending for one shared lock.</desc>
<style>
  .dgm-label { fill: #6E6D67; }
  .dgm-line  { stroke: #D9D7CC; }
  @media (prefers-color-scheme: dark) {
    .dgm-label { fill: #B7B5AA; }
    .dgm-line  { stroke: #55534C; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M 105.0,172.5 C 130.0,172.5 130.0,172.5 155.0,172.5" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="5.0" y="150.5" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="55.0" y="172.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">Main Program</text></g><g><rect x="155.0" y="150.5" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="220.0" y="172.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">Spawn 4 Processes</text></g><rect x="155.0" y="216.5" width="130" height="34" rx="7" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/><text x="220" y="233.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" class="dgm-label">Shorthand: P1 - P4</text><path d="M 285.0,172.5 C 300.0,172.5 300.0,40 315.0,40" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="315.0" y="18.0" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Process 1: has its own GIL</text></g><path d="M 485.0,40 C 503.75,40 503.75,40 522.5,40" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="522.5" y="18.0" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="610.0" y="32.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Runs CPU-heavy task</text><text x="610.0" y="47.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">on core 1</text></g><path d="M 697.5,40 C 706.25,40 706.25,172.5 715.0,172.5" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 285.0,172.5 C 300.0,172.5 300.0,130 315.0,130" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="315.0" y="108.0" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Process 2: has its own GIL</text></g><path d="M 485.0,130 C 503.75,130 503.75,130 522.5,130" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="522.5" y="108.0" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="610.0" y="122.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Runs CPU-heavy task</text><text x="610.0" y="137.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">on core 2</text></g><path d="M 697.5,130 C 706.25,130 706.25,172.5 715.0,172.5" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 285.0,172.5 C 300.0,172.5 300.0,220 315.0,220" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="315.0" y="198.0" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Process 3: has its own GIL</text></g><path d="M 485.0,220 C 503.75,220 503.75,220 522.5,220" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="522.5" y="198.0" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="610.0" y="212.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Runs CPU-heavy task</text><text x="610.0" y="227.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">on core 3</text></g><path d="M 697.5,220 C 706.25,220 706.25,172.5 715.0,172.5" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 285.0,172.5 C 300.0,172.5 300.0,300 315.0,300" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="315.0" y="278.0" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="300.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Process 4: has its own GIL</text></g><path d="M 485.0,300 C 503.75,300 503.75,300 522.5,300" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="522.5" y="278.0" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="610.0" y="292.25" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">Runs CPU-heavy task</text><text x="610.0" y="307.75" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">on core 4</text></g><path d="M 697.5,300 C 706.25,300 706.25,172.5 715.0,172.5" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="715.0" y="147.5" width="150" height="50" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="790.0" y="172.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041"></text></g><path d="M 730.1428571428571,172.5 L 735.2857142857143,178.21428571428572 L 744.4285714285714,165.64285714285714" fill="none" stroke="#0F6E56" stroke-width="2.7428571428571424" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="172.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">All tasks run</text><text x="800" y="187.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#085041">in parallel</text>
</svg>