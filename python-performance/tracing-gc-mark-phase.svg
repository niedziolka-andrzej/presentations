<svg width="100%" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img" font-family='anthropic-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'>
  <title>Tracing garbage collector mark phase</title>
  <desc>Three roots (call stack, static fields, CPU registers) trace outward to mark reachable objects alive. An orphan object with no path from any root is left as garbage.</desc>

  <style>
    .dgm-label { fill: #6E6D67; }
    @media (prefers-color-scheme: dark) {
      .dgm-label { fill: #B7B5AA; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- walked edges (teal) -->
  <line x1="240" y1="75"  x2="283" y2="83"  stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="375" x2="310" y2="127" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="225" x2="284" y2="239" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="357" y1="80"  x2="433" y2="60"  stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="355" y1="104" x2="435" y2="136" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="358" y1="250" x2="432" y2="250" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- roots (blue), each with a dev-facing explanation -->
  <g>
    <rect x="20" y="20" width="220" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="130" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Stack frame</text>
    <text x="130" y="60" text-anchor="middle" font-size="12" fill="#185FA5">local var: order</text>
    <text x="130" y="82" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">Every running method,</text>
    <text x="130" y="96" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">on every thread</text>
  </g>
  <g>
    <rect x="20" y="170" width="220" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="130" y="192" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Static field</text>
    <text x="130" y="210" text-anchor="middle" font-size="12" fill="#185FA5">Config.Instance</text>
    <text x="130" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">Globals that live for the</text>
    <text x="130" y="246" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">whole program</text>
  </g>
  <g>
    <rect x="20" y="320" width="220" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="130" y="342" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">CPU register</text>
    <text x="130" y="360" text-anchor="middle" font-size="12" fill="#185FA5">temp ref: order</text>
    <text x="130" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">Values mid-computation,</text>
    <text x="130" y="396" text-anchor="middle" font-size="11" font-style="italic" fill="#44443f">not yet written to memory</text>
  </g>

  <!-- reachable heap objects (teal) -->
  <g>
    <circle cx="320" cy="90" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="320" y="90" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Order</text>
  </g>
  <g>
    <circle cx="470" cy="50" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="470" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Customer</text>
  </g>
  <g>
    <circle cx="470" cy="150" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="470" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Address</text>
  </g>
  <g>
    <circle cx="320" cy="250" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="320" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Logger</text>
  </g>
  <g>
    <circle cx="470" cy="250" r="38" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="470" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Buffer</text>
  </g>

  <!-- orphan (unreachable, garbage) -->
  <g opacity="0.8">
    <circle cx="596" cy="150" r="38" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="596" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">Orphan</text>
  </g>

  <!-- legend -->
  <rect x="40" y="450" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="60" y="461" font-size="12" class="dgm-label">Root — always reachable</text>

  <rect x="40" y="470" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="60" y="481" font-size="12" class="dgm-label">Marked alive — reachable from a root</text>

  <rect x="40" y="490" width="14" height="14" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-dasharray="4 3"/>
  <text x="60" y="501" font-size="12" class="dgm-label">Unreachable — collected as garbage</text>
</svg>
